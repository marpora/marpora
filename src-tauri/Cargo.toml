[package]
name = "marpora"
version = "0.3.1"
description = "A small, local Markdown and Marp workspace"
authors = ["Xiaoguang Wang"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
name = "marpora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
