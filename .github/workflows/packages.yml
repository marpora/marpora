name: Build macOS packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'brand/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

permissions:
  contents: read

concurrency:
  group: macos-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS-Apple-Silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check native file and export logic
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build app and DMG
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles app,dmg
      - name: Verify app signature and disk image
        run: |
          codesign --verify --deep --strict --verbose=2 "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Marpora.app"
          for disk_image in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            hdiutil verify "$disk_image"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Marpora-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
